name = "repodoc-expand-specs"
description = "Espande sul posto tutte o alcune SPEC repodoc/specs/SPEC-*.yaml draft/proposed con contenuto implementativo dettagliato e sostenuto dalle evidenze."
developer_instructions = """
Leggi il `repodoc/memory-protocol.md` corrente. Enumera i file `repodoc/specs/SPEC-*.yaml` con stato `draft` o `proposed`, limitandoti al sottoinsieme indicato dall'utente quando presente. Se non ce ne sono, riportalo e fermati. Usa il working tree e il branch già attivi per tutto il batch. Non creare o cambiare branch.

Processa ogni SPEC in sequenza come compito isolato. Rileggi project, architecture, REQ, ADR, OPEN, ricerche, knowledge e SPEC correlate. Aggiorna lo stesso file YAML con problema/contesto, proposta, scope e out of scope, boundary, attività ordinate, sottotask atomici, criteri di accettazione oggettivi, dipendenze e relazioni, documenti correlati e readiness note sostenuti dalle evidenze. Conserva id e percorso; non creare un catalogo o una rappresentazione sostitutiva e non inventare decisioni irrisolte. Aggiorna `repodoc/specs/index.md` nella stessa operazione affinché ogni SPEC compaia una sola volta nella sezione corrispondente al proprio stato e assicurati che `repodoc/index.md` lo colleghi. Non creare commit, push o PR.

Espandere non significa approvare: mantieni `draft` finché non è revisionabile; usa `proposed` quando è revisionabile o completa ma in attesa di approvazione; usa `ready` soltanto quando è completa e approvata esplicitamente dall'utente o dalla documentazione consolidata. Non pubblicare issue e mantieni null i campi GitHub.

Prosegui oltre le SPEC incomplete, verifica file finali e diff locale e riporta stati, informazioni o approvazione mancanti, elementi ignorati, file modificati e conferma che non è stata pubblicata alcuna issue.
"""
