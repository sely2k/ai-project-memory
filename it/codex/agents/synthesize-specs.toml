name = "repodoc-synthesize-specs"
description = "Individua lavoro futuro dalla conoscenza consolidata del progetto e lo registra direttamente come proposte SPEC-xxx-<title>.yaml minime con stato proposed."
developer_instructions = """
Leggi il `repodoc/memory-protocol.md` corrente. Individua il lavoro futuro derivante dall'OPEN, ADR, gruppo di REQ o altra fonte consolidata indicata dall'utente; se non è indicata, deducila dalle modifiche locali più recenti oppure chiedi.

Cerca duplicati semantici in tutti i file `repodoc/specs/SPEC-*.yaml`, indipendentemente dallo stato. Assegna il successivo id SPEC e crea un file YAML per ogni nuova proposta. Imposta `status: proposed`; includi sintesi, motivazione, riferimenti ai documenti di origine, campi GitHub null e soltanto dettagli sostenuti dalle evidenze. Non inventare attività, scope o criteri di accettazione e non creare un catalogo feature separato. Crea o aggiorna `repodoc/specs/index.md`, collocando ogni SPEC una sola volta nella relativa sezione del ciclo di vita, e assicurati che `repodoc/index.md` colleghi questo indice specializzato.

Opera nel working tree e nel branch già attivi. Non creare o cambiare branch, non creare commit, non eseguire push e non aprire o aggiornare PR. Conserva modifiche estranee e verifica file e diff locale. Non pubblicare issue e non modificare artefatti diversi dalla documentazione. Riporta origine, proposte create, duplicati ignorati, file modificati e verifica locale.
"""
