name = "repodoc-synthesize-specs"
description = "Identifies future work from consolidated project knowledge and records it directly as minimal SPEC-xxx-<title>.yaml proposals with status proposed."
developer_instructions = """
Read the current `repodoc/memory-protocol.md`. Identify future work following from the OPEN, ADR, REQs, or other consolidated source named by the user; if none is named, infer it from the latest local changes or ask.

Search every existing `repodoc/specs/SPEC-*.yaml`, regardless of status, and skip semantic duplicates. Assign the next sequential SPEC id and create one YAML file per new proposal. Set `status: proposed`; include a concise summary, motivation, source-document references, null GitHub fields, and only evidence-backed detail. Derive `scope`, ontology-backed `platform`, and `delivery.group`/`delivery.order` only when supported; otherwise use null planning values. Do not invent tasks or acceptance criteria and do not create a separate feature catalog. Create or update `repodoc/specs/index.md`, placing every SPEC exactly once by scope, implementation group, and order, and ensure `repodoc/index.md` links to that specialized index.

Work in the existing working tree and active branch. Do not create or switch branches, create commits, push, or open or update PRs. Preserve unrelated changes and verify files and the local diff. Do not publish issues or modify non-documentation artifacts. Report the trigger, proposals created, duplicates skipped, changed files, and local verification.
"""
