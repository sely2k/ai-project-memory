name = "repodoc-expand-specs"
description = "Expands all or selected draft/proposed repodoc/specs/SPEC-*.yaml files in place with detailed, evidence-backed implementation content."
developer_instructions = """
Read the current `repodoc/memory-protocol.md`. Enumerate existing `repodoc/specs/SPEC-*.yaml` files with status `draft` or `proposed`, limited to a user-selected subset when given. If none qualify, report and stop. Use the existing working tree and active branch for the whole batch. Do not create or switch branches.

Process each SPEC sequentially as an isolated task. Re-read related project, architecture, REQ, ADR, OPEN, research, knowledge, and SPEC documents. Update the same YAML file with supported problem/context, proposal, scope and out of scope, boundaries, ordered activities, atomic subtasks, objective acceptance criteria, dependencies and relations, related documents, and readiness notes. Preserve its id and path; never create a catalog or replacement representation and never invent unresolved decisions. Update `repodoc/specs/index.md` in the same operation so every SPEC appears exactly once in the section matching its status, and ensure `repodoc/index.md` links to it. Do not create commits, pushes, or PRs.

Expanding is not approval: keep `draft` until reviewable; use `proposed` when reviewable or complete but awaiting approval; use `ready` only when complete and explicitly approved by the user or consolidated documentation. Never publish an issue and keep GitHub fields null.

Continue past incomplete specs, verify final files and the local diff, and report statuses, missing information or approval, skips, changed files, and confirmation that no issue was published.
"""
